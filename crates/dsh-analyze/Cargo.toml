[package]
name = "dsh-analyze"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dsh-analyze CLI: ingest/head/schema/describe/agg/list/export/rm + profile/dedup/outliers for session datasets"

[[bin]]
name = "dsh-analyze"
path = "src/main.rs"

[dependencies]
arrow-array = "55"
arrow-schema = "55"
# Parquet ingest/export (R-22/R-23). arrow feature for record-batch reader/writer.
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "zstd"] }
rust_xlsxwriter = "0.67"
# CSV GBK/GB18030 decode for ingest --encoding (R-30); WHATWG gb18030-capable.
encoding_rs = "0.8"
# xlsx ingest read (R-31); pure Rust, pairs with rust_xlsxwriter on the write side.
calamine = "0.30"
# sourceChecksum SHA-256 for ingest provenance (R-33).
sha2 = "0.10"
