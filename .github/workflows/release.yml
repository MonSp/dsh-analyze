name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Pure-std Rust cross-compiles between Apple targets on the arm64 runner.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p dsh-analyze --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN_EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then BIN_EXT=".exe"; fi
          # cargo workspace target dir sits at the repo root
          SRC="target/${{ matrix.target }}/release/dsh-analyze${BIN_EXT}"
          STAGE="dsh-analyze-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/dsh-analyze${BIN_EXT}"
          cp README.md LICENSE "$STAGE/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  checksum-and-publish:
    name: Checksum + GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: Publish npm
    needs: build
    runs-on: ubuntu-latest
    # id-token: write → npm Trusted Publishing (OIDC). Optional NPM_TOKEN secret
    # is used automatically when set (granular token with publish + bypass 2FA).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; runners ship older.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Build plugin
        working-directory: packages/dsh-analyze
        run: |
          npm install
          npm run build
      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/dsh-analyze/package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match packages/dsh-analyze version $PKG" >&2
            exit 1
          fi
      - name: Publish to npm
        working-directory: packages/dsh-analyze
        env:
          # Optional fallback: secrets.NPM_TOKEN. Empty → OIDC trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
